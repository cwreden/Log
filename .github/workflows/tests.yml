name: Tests

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      # Keep every version running: if 8.5 fails we still want to see 8.2-8.4.
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # No lock file on purpose, see .gitignore: each PHP version has to pick its own
      # PHPUnit line (11.x on 8.2, 12.x from 8.3, 13.x from 8.4).
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Show resolved versions
        run: composer show --direct

      - name: Run tests
        run: vendor/bin/phpunit
